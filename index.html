<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealWheel - Decide Dinner Fast</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Work+Sans:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style type="text/tailwindcss" data-teda="tailwind-apply">
        @layer components {
            .btn-primary { @apply inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-white transition-all duration-300 bg-orange-600 rounded-full shadow-lg hover:bg-orange-700 hover:shadow-orange-500/30 hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-orange-300; }
            .btn-secondary { @apply inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-slate-800 transition-all duration-300 bg-white border-2 border-slate-200 rounded-full shadow-sm hover:bg-slate-50 hover:border-slate-300 hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-slate-200; }
        }
    </style>
</head>
<body class="font-body antialiased text-slate-800 bg-white overflow-x-hidden">
    <nav class="absolute top-0 left-0 w-full z-50 p-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <!-- Logo Icon -->
                <svg class="w-8 h-8 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-heading text-2xl font-black tracking-tighter text-slate-900">MealWheel</span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="min-h-screen flex flex-col lg:flex-row">
        <!-- Left Content (35% width on large screens) -->
        <div class="w-full lg:w-[35%] flex flex-col justify-center items-start p-8 lg:p-16 xl:p-24 bg-white z-10 order-2 lg:order-1">
            <div class="max-w-md">
                <h1 class="font-heading text-5xl lg:text-7xl font-black leading-[0.9] mb-6 text-slate-900">
                    STOP <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-600">DEBATING</span> <br>
                    DINNER.
                </h1>
                <p class="text-lg text-slate-600 mb-10 leading-relaxed font-medium">
                    Decision fatigue is real. Let the wheel decide your fate. Customizable lists, smart weighting, and instant decisions.
                </p>
                <div class="flex flex-col sm:flex-row gap-4">
                    <a href="app.html" class="btn-primary">
                        Launch Spinner
                        <svg class="w-5 h-5 ml-2 -mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Right Visual (65% width) -->
        <div class="w-full lg:w-[65%] bg-slate-50 relative h-[50vh] lg:h-screen overflow-hidden order-1 lg:order-2">
            <!-- Decorative Abstract Shapes -->
            <div class="absolute inset-0 opacity-10 pattern-grid-lg text-slate-300"></div>
            
            <!-- Dynamic Composition -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[80%] max-w-2xl">
                 <!-- Abstract Wheel Representation -->
                 <div class="relative w-full h-full">
                     <div class="absolute top-0 right-0 w-64 h-64 bg-orange-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
                     <div class="absolute top-0 left-0 w-64 h-64 bg-red-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
                     <div class="absolute bottom-0 left-20 w-64 h-64 bg-yellow-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
                     
                     <!-- Hero Image / Graphic -->
                     <div class="relative z-10 flex items-center justify-center h-full">
                        <img src="logo.svg" alt="Meal Wheel Logo" class="w-48 h-48 lg:w-64 lg:h-64 drop-shadow-2xl transform hover:scale-110 transition-transform duration-500">
                     </div>
                 </div>
            </div>
        </div>
    </main>

    <script>
        // Simple marketing page interaction
        $(document).ready(function() {
            $('.animate-blob').each(function(i) {
                $(this).css('animation-delay', (i * 2) + 's');
            });
        });
    </script>
</body>
</html>
